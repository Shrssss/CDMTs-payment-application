spring:
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3306/release_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=false'
    username: 'test_user'
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update   # none, validate, update, create, create-drop 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
paysys:
  public-origin: https://mobile-order.codemates.org
  action-url: ${PAYMENT_ACTION_URL}
  card-ip: ${PAYSYS_CARD_IP}
  paypay-ip: ${PAYSYS_PAYPAY_IP}
  return-paths:
    card-ok: '/?paysys_return=card&result=ok'
    card-error: '/?paysys_return=card&result=error'
    paypay-ok: '/?paysys_return=paypay&result=ok'
    paypay-cancel: '/?paysys_return=paypay&result=cancel'

mybatis:
   mapper-locations: classpath:mapper/*.xml

server:
   port: 8080
   address: 0.0.0.0
   use-forward-headers: true
