<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗用画面 ログイン</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="container">
        <h1>店舗用画面</h1>

        <!-- ログイン前と後で出し分ける。切り替えは login.js が行う -->
        <form id="login-form" class="login-form" hidden>
            <p>パスワードを入力してください。</p>

            <label class="field">
                <span class="field-label">パスワード</span>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required autofocus>
            </label>

            <button type="submit" id="submit-button">ログイン</button>
        </form>

        <div id="logged-in" class="logged-in" hidden>
            <p>ログイン済みです。</p>

            <!-- ?next= で別の画面から送られてきたときだけ出す。中身は login.js が入れる -->
            <a id="back-link" class="back-link" hidden></a>

            <ul class="page-links">
                <li><a href="/monitor.html">呼び出しモニター</a></li>
                <li><a href="/cooking.html">調理</a></li>
                <li><a href="/handover.html">受け渡し</a></li>
                <li><a href="/stock.html">在庫</a></li>
            </ul>

            <button type="button" id="logout-button" class="secondary">ログアウト</button>
        </div>

        <div id="message" class="message" role="status"></div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
